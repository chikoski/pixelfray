version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "gitsubmodule"
    directory: "/"
    schedule:
      interval: "weekly"
    # Updating third_party/png-glitch requires rebuilding app/src/main/wasm/png-glitch-component.wasm
    # via ./build-wasm.sh, so leave it out of automated Dependabot submodule bumps.
    ignore:
      - dependency-name: "third_party/png-glitch"
