name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The Gradle daemon JVM comes from gradle/gradle-daemon-jvm.properties (JDK 21); setup-java provides it.

jobs:
  android:
    name: Android build, JVM tests, R8
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      # The runner image ships the Android SDK and sets ANDROID_HOME.
      - run: ./gradlew -PgenerateBaselineProfileOnBuild=false :app:testDebugUnitTest :app:assembleRelease :app:assembleDebugAndroidTest
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-test-reports
          path: app/build/reports/
